name: Averiq CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [finish-core-product-systems]

permissions:
  contents: read

concurrency:
  group: averiq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check
